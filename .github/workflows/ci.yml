name: CI/CD

# Lint and test gate for every push and pull request, plus automatic deploy of
# the API to EC2 on pushes to `dev`. S6 exit criteria: CI runs on every PR and
# must pass before deploy — the deploy-api job enforces this via `needs`.
#
# The client has no deploy job on purpose: Amplify Hosting watches `dev` and
# rebuilds the SPA on every push by itself.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm workspaces: install once at the root for both packages.
      - run: npm ci

      - name: Lint
        run: npm run lint --workspace server

      # The suite mocks Mongo, DynamoDB and Cognito, so no services are needed.
      # tests/setupEnv.js supplies the environment, including the explicit
      # CODE_RUNNER_ADAPTER=dev opt-in.
      - name: Test
        run: npm test --workspace server

  client:
    name: Client — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace client

      # No client test step yet — React Testing Library is planned but no specs
      # exist, so `npm test --workspace client` would fail on a missing runner.
      # The production build is the current regression signal.
      - name: Build
        run: npm run build --workspace client
        env:
          # Build-time placeholders: Vite inlines VITE_* at build time, and the
          # real values are injected by the hosting environment on deploy.
          VITE_API_BASE_URL: http://localhost:4000/api
          VITE_COGNITO_USER_POOL_ID: eu-west-1_ci
          VITE_COGNITO_CLIENT_ID: ci-client-id
          VITE_COGNITO_REGION: eu-west-1

  deploy-api:
    name: Deploy API to EC2
    # Deploys the exact commit that passed the two gates above, and only for
    # direct pushes to `dev` (the live branch) — never for PRs or `main`.
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # OIDC: the job trades a GitHub-signed identity token for short-lived AWS
    # credentials by assuming the deploy role — no static keys in GitHub.
    # One-time AWS + GitHub setup is documented in DEPLOYMENT.md §10.
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-west-1
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      # SSM Run Command reaches the instance through the same channel as
      # Session Manager, so nothing is opened to GitHub's runner IPs and no
      # SSH keys exist. The remote side resets the tree to $GITHUB_SHA (the
      # tested commit) and hands over to deploy/update-ec2.sh from that tree.
      # flock serialises concurrent deploys on the instance: cancelling this
      # job only stops the polling below, not a remote script already running.
      - name: Update the instance via SSM Run Command
        run: |
          set -euo pipefail

          # `vars.` reads repository *variables*; a value saved under Secrets
          # instead arrives here as an empty string, and the AWS error for that
          # names neither the variable nor where it should live.
          if [ -z "${INSTANCE_ID:-}" ]; then
            echo "EC2_INSTANCE_ID is empty. Set it as a repository VARIABLE" >&2
            echo "(Settings -> Secrets and variables -> Actions -> Variables tab)," >&2
            echo "not a secret. Value is the i-... id of the learncode-api instance." >&2
            exit 1
          fi

          # HOME first: SSM Run Command runs as root but with a bare
          # environment, and an unset HOME makes `git config --global` fail
          # outright ("fatal: $HOME not set") and npm lose its cache dir. An
          # interactive Session Manager shell does set it, so a command that
          # works by hand can still fail here.
          REMOTE="export HOME=/root; git config --global --get-all safe.directory | grep -qx /opt/learncode || git config --global --add safe.directory /opt/learncode; git -C /opt/learncode fetch origin dev; git -C /opt/learncode reset --hard $GITHUB_SHA; bash /opt/learncode/deploy/update-ec2.sh"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "learncode deploy ${GITHUB_SHA:0:7}" \
            --parameters "{\"commands\":[\"flock -w 600 /var/lock/learncode-deploy.lock bash -euo pipefail -c '$REMOTE'\"],\"executionTimeout\":[\"900\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            # Immediately after send-command the invocation may not exist yet.
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "  status: $STATUS"
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          echo "--- remote stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "--- remote stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text

          [ "$STATUS" = "Success" ]

      # End-to-end: the public path learners actually use (CloudFront → nginx
      # → node). update-ec2.sh already verified localhost:4000 on the box.
      - name: Verify public health endpoint
        run: curl -sfS --max-time 15 https://d3n7zqt9fcw62k.cloudfront.net/health
