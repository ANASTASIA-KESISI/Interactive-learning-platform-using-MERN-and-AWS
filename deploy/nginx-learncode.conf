# nginx reverse proxy for the LearnCode API.
#
# Install:
#   sudo cp deploy/nginx-learncode.conf /etc/nginx/conf.d/learncode.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain a certificate, which rewrites this file in place to add the TLS
# listener and an HTTP->HTTPS redirect:
#   sudo dnf install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.example.org
#
# Only 80/443 are exposed publicly; the API itself listens on loopback:4000 and
# is not reachable from outside the instance.

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE-WITH-API-DOMAIN;

    # Health check stays available without TLS so the load balancer or uptime
    # monitor can reach it before certificates are issued.
    location /health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Express is configured with `trust proxy` in production, so it reads
        # the client address from these headers. Without them the rate limiter
        # buckets every learner under the proxy's own address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A code submission is a synchronous request that waits on Lambda:
        # ~80ms warm, but a cold start plus the runner's own 5s script guard can
        # approach 10s. Keep this above that or nginx will 504 a submission the
        # API was about to answer correctly.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Learner submissions are small; this also caps a trivially abusive payload.
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json;
}
