# nginx reverse proxy for the LearnCode API.
#
# Install:
#   sudo cp deploy/nginx-learncode.conf /etc/nginx/conf.d/learncode.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain a certificate, which rewrites this file in place to add the TLS
# listener and an HTTP->HTTPS redirect:
#   sudo dnf install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.example.org
#
# Only 80/443 are exposed publicly; the API itself listens on loopback:4000 and
# is not reachable from outside the instance.

# The EC2 public DNS name below is 47 characters, which does not fit nginx's
# default server-name hash bucket (64 bytes, minus per-entry overhead), and
# nginx refuses to start rather than truncating: "could not build
# server_names_hash". This directive is http-level, which is legal here
# because conf.d/*.conf is included inside the http block.
server_names_hash_bucket_size 128;

server {
    listen 80;
    listen [::]:80;
    # The instance's public DNS name — CloudFront's origin request policy
    # (AllViewerExceptHostHeader) sends this as the Host header. Kept in the
    # repo (not edited on the host) so CI can re-copy this file on deploy.
    server_name ec2-18-203-8-24.eu-west-1.compute.amazonaws.com;

    # Health check stays available without TLS so the load balancer or uptime
    # monitor can reach it before certificates are issued.
    location /health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Express is configured with `trust proxy` in production, so it reads
        # the client address from these headers. Without them the rate limiter
        # buckets every learner under the proxy's own address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A code submission is a synchronous request that waits on Lambda:
        # ~80ms warm, but a cold start plus the runner's own 5s script guard can
        # approach 10s. Keep this above that or nginx will 504 a submission the
        # API was about to answer correctly.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Learner submissions are small; this also caps a trivially abusive payload.
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json;
}
